<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metropolis Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        #previewVideo        { opacity: 1; }
        #previewVideoReverse { opacity: 0; }

        #outputFadeOverlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background: #000;
            opacity: 0;
            transition: opacity 45ms linear;
        }
    </style>
</head>
<body>
    <video id="previewVideo" muted></video>
    <video id="previewVideoReverse" muted></video>
    <div id="outputFadeOverlay" aria-hidden="true"></div>

    <script>
        const video = document.getElementById('previewVideo');
        const videoReverse = document.getElementById('previewVideoReverse');
        const outputFadeOverlay = document.getElementById('outputFadeOverlay');

        function setOutputFade(level) {
            const safeLevel = Math.max(0, Math.min(1, Number(level)));
            outputFadeOverlay.style.opacity = String(1 - safeLevel);
        }

        // Ensure both are muted
        video.muted = true;
        video.volume = 0;
        videoReverse.muted = true;
        videoReverse.volume = 0;

        let activeElement = 'forward'; // 'forward' | 'reverse'
        function getActiveVideo() {
            return activeElement === 'reverse' ? videoReverse : video;
        }

        function latencyEpochNow() {
            return performance.timeOrigin + performance.now();
        }

        function latencyFrameMatches(trace, mediaTime) {
            if (Number.isFinite(trace.targetTime)) {
                return Math.abs(mediaTime - trace.targetTime) <= 0.12;
            }
            if (trace.direction < 0) return mediaTime < trace.baselineMediaTime - 0.001;
            if (trace.direction > 0) return mediaTime > trace.baselineMediaTime + 0.001;
            return Math.abs(mediaTime - trace.baselineMediaTime) > 0.001;
        }

        function measureLatencyFrame(trace) {
            const activeVideo = getActiveVideo();
            // The main renderer receives pop-out time updates at only ~10fps.
            // Capture the playback owner's exact time here so direction changes
            // are measured from the frame that was actually visible.
            const localTrace = {
                ...trace,
                baselineMediaTime: activeVideo.currentTime
            };
            if (!activeVideo.requestVideoFrameCallback) {
                window.electronAPI.sendPreviewUpdate({
                    type: 'latency-unavailable',
                    trace: localTrace,
                    output: 'pop-out'
                });
                return;
            }
            let settled = false;
            const timeoutId = setTimeout(() => {
                if (settled) return;
                settled = true;
                window.electronAPI.sendPreviewUpdate({
                    type: 'latency-timeout',
                    trace: localTrace,
                    output: 'pop-out'
                });
            }, 2000);
            const checkFrame = (now, metadata) => {
                if (settled) return;
                if (latencyFrameMatches(localTrace, metadata.mediaTime)) {
                    settled = true;
                    clearTimeout(timeoutId);
                    window.electronAPI.sendPreviewUpdate({
                        type: 'latency-result',
                        trace: localTrace,
                        frameData: {
                            output: 'pop-out',
                            presentedAt: performance.timeOrigin + metadata.expectedDisplayTime,
                            processingDuration: metadata.processingDuration
                        }
                    });
                    return;
                }
                activeVideo.requestVideoFrameCallback(checkFrame);
            };
            activeVideo.requestVideoFrameCallback(checkFrame);
        }

        // Send time updates back to main window for timeline scrubber (throttled to ~10fps)
        let lastReportedTime = -1;
        let lastReportTimestamp = 0;
        let activeNavigationGeneration = 0;

        function adoptNavigationGeneration(command) {
            if (Number.isInteger(command?.navigationGeneration)) {
                activeNavigationGeneration = Math.max(
                    activeNavigationGeneration,
                    command.navigationGeneration
                );
            }
        }

        function withNavigationGeneration(update) {
            return {
                ...update,
                navigationGeneration: activeNavigationGeneration
            };
        }

        function reportTimeUpdate() {
            const now = performance.now();
            if (now - lastReportTimestamp > 100) { // ~10fps throttle
                const activeVideo = getActiveVideo();
                if (!activeVideo.paused && activeVideo.currentTime !== lastReportedTime) {
                    lastReportedTime = activeVideo.currentTime;
                    lastReportTimestamp = now;
                    window.electronAPI.sendPreviewUpdate(withNavigationGeneration({
                        type: 'timeupdate',
                        currentTime: activeVideo.currentTime,
                        duration: activeVideo.duration
                    }));
                }
            }
            requestAnimationFrame(reportTimeUpdate);
        }
        requestAnimationFrame(reportTimeUpdate);

        // Acknowledge explicit seeks so decoder-paced reverse scrub modes do
        // not send the next frame until this one is ready to display.
        function reportSeekComplete(event) {
            const activeVideo = event.currentTarget;
            if (activeVideo !== getActiveVideo()) return;
            window.electronAPI.sendPreviewUpdate(withNavigationGeneration({
                type: 'seeked',
                currentTime: activeVideo.currentTime,
                duration: activeVideo.duration
            }));
        }
        video.addEventListener('seeked', reportSeekComplete);
        videoReverse.addEventListener('seeked', reportSeekComplete);

        // Report ended events for bounce mode
        video.addEventListener('ended', () => {
            window.electronAPI.sendPreviewUpdate(withNavigationGeneration({
                type: 'ended',
                element: 'forward'
            }));
        });

        videoReverse.addEventListener('ended', () => {
            window.electronAPI.sendPreviewUpdate(withNavigationGeneration({
                type: 'ended',
                element: 'reverse'
            }));
        });

        // Listen for commands from main window
        if (window.electronAPI) {
            window.electronAPI.onPreviewCommand((command) => {
                adoptNavigationGeneration(command);
                switch (command.type) {
                    case 'loadClip':
                        video.src = command.src;
                        video.style.opacity = '1';
                        videoReverse.style.opacity = '0';
                        activeElement = 'forward';
                        if (command.reverseSrc) {
                            videoReverse.src = command.reverseSrc;
                        }
                        if (command.currentTime !== undefined) {
                            video.addEventListener('loadeddata', function onLoad() {
                                video.currentTime = command.currentTime;
                                video.removeEventListener('loadeddata', onLoad);
                            });
                        }
                        break;

                    case 'loadReverse':
                        videoReverse.src = command.src;
                        break;

                    case 'play':
                        const activePlay = getActiveVideo();
                        activePlay.play().catch(e => console.error('Play error:', e));
                        break;

                    case 'pause':
                        video.pause();
                        videoReverse.pause();
                        break;

                    case 'pauseAndReport': {
                        const activePause = getActiveVideo();
                        video.pause();
                        videoReverse.pause();
                        window.electronAPI.sendPreviewUpdate(withNavigationGeneration({
                            type: 'paused',
                            reason: command.reason,
                            currentTime: activePause.currentTime,
                            duration: activePause.duration
                        }));
                        break;
                    }

                    case 'seek':
                        const activeSeek = getActiveVideo();
                        activeSeek.currentTime = command.time;
                        break;

                    case 'setSpeed':
                        video.playbackRate = command.rate;
                        videoReverse.playbackRate = command.rate;
                        break;

                    case 'measureLatencyFrame':
                        measureLatencyFrame(command.trace);
                        break;

                    case 'setOutputFade':
                        setOutputFade(command.level);
                        break;

                    case 'switchToForward':
                        videoReverse.pause();
                        videoReverse.style.opacity = '0';
                        video.style.opacity = '1';
                        activeElement = 'forward';
                        if (command.currentTime !== undefined) {
                            video.currentTime = command.currentTime;
                        }
                        if (command.rate) {
                            video.playbackRate = command.rate;
                        }
                        video.play().catch(e => console.error('Play error:', e));
                        break;

                    case 'switchToReverse':
                        video.pause();
                        video.style.opacity = '0';
                        videoReverse.style.opacity = '1';
                        activeElement = 'reverse';
                        if (command.currentTime !== undefined) {
                            videoReverse.currentTime = command.currentTime;
                        }
                        if (command.rate) {
                            videoReverse.playbackRate = command.rate;
                        }
                        videoReverse.play().catch(e => console.error('Play error:', e));
                        break;

                    case 'setLoop':
                        video.loop = command.loop;
                        break;

                    case 'setState':
                        if (command.outputFadeLevel !== undefined) {
                            setOutputFade(command.outputFadeLevel);
                        }
                        // Full state restore (used when pop-out first opens)
                        if (command.src) {
                            video.src = command.src;
                        }
                        if (command.reverseSrc) {
                            videoReverse.src = command.reverseSrc;
                        }
                        if (command.activeElement === 'reverse') {
                            video.style.opacity = '0';
                            videoReverse.style.opacity = '1';
                            activeElement = 'reverse';
                        } else {
                            video.style.opacity = '1';
                            videoReverse.style.opacity = '0';
                            activeElement = 'forward';
                        }
                        const target = (command.activeElement === 'reverse') ? videoReverse : video;
                        target.addEventListener('loadeddata', function onLoad() {
                            if (command.currentTime !== undefined) {
                                target.currentTime = command.currentTime;
                            }
                            if (command.rate) {
                                target.playbackRate = command.rate;
                            }
                            if (command.loop !== undefined) {
                                video.loop = command.loop;
                            }
                            if (command.playing) {
                                target.play().catch(e => console.error('Play error:', e));
                            }
                            target.removeEventListener('loadeddata', onLoad);
                        });
                        break;
                }
            });
        }

        // Show cursor on mouse move, hide after 3 seconds of inactivity
        let cursorTimeout;
        document.addEventListener('mousemove', () => {
            document.body.style.cursor = 'default';
            clearTimeout(cursorTimeout);
            cursorTimeout = setTimeout(() => {
                document.body.style.cursor = 'none';
            }, 3000);
        });

        // Toggle fullscreen on double-click
        document.addEventListener('dblclick', () => {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen();
            }
        });

        console.log('Metropolis Preview Pop-Out Ready');
    </script>
</body>
</html>
